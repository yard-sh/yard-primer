<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Primer</title>
    <!-- Relative URLs only: the app serves under /<slug>/app/, so a
         root-absolute /styles.css would resolve against the DOMAIN root. -->
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="styles.css" />
    <script>
      // Apply the saved theme before first paint so there is no flash. The
      // landing page shares the key: same origin, same choice.
      try {
        var saved = localStorage.getItem("primer.theme");
        if (saved) document.documentElement.dataset.theme = saved;
      } catch (e) {}
    </script>
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <a class="skip" href="#view">Skip to content</a>

    <header class="bar">
      <div class="wrap bar__inner">
        <a class="brand" href="../" aria-label="Primer home">
          <span class="brand__tile" aria-hidden="true"><small>59</small>Pr</span>
          <span class="brand__name">Primer</span>
        </a>

        <nav class="bar__nav" aria-label="Primary">
          <a href="#/" data-nav="catalog">Courses</a>
          <a href="#/admin" data-nav="admin" id="nav-admin" hidden>Admin</a>
        </nav>

        <div class="bar__end">
          <button class="iconbtn" id="theme-toggle" type="button" title="Switch theme" aria-label="Switch theme">
            <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5z" />
            </svg>
          </button>

          <a class="btn btn--sm btn--primary" id="sign-in" href="__yard/auth/login?return=/" hidden>Sign in</a>

          <div class="account" id="account" hidden>
            <button class="account__btn" id="account-button" type="button" aria-haspopup="true" aria-expanded="false">
              <span class="account__initial" id="account-initial" aria-hidden="true"></span>
              <span class="account__plan" id="account-plan"></span>
              <span class="sr">Account</span>
            </button>
            <div class="menu" id="account-menu" hidden>
              <div class="menu__who">
                <strong id="account-email"></strong>
                <span class="label" id="account-role"></span>
              </div>
              <a href="../#pricing" id="menu-upgrade">Upgrade to Premium</a>
              <a href="../#pricing" id="menu-plan" hidden>Your plan</a>
              <a href="#/admin" id="menu-admin" hidden>Admin</a>
              <a href="../">Primer home</a>
              <a href="__yard/auth/logout?return=/">Sign out</a>
            </div>
          </div>
        </div>
      </div>
    </header>

    <main id="view" tabindex="-1">
      <p class="wrap loading">Loading the table</p>
    </main>

    <footer class="foot">
      <div class="wrap foot__inner">
        <span>Primer · Learn how things work, one section at a time.</span>
        <span><a href="../">Home</a> · <a href="../#pricing">Plans</a></span>
      </div>
    </footer>

    <dialog class="sheet" id="sheet"></dialog>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  </body>
</html>
